<text x="660" y="118" font-size="14" fill="#ff5370" font-weight="bold">PIN 1 /</text>
<text x="640" y="725" font-size="16" fill="#e6edf3" font-weight="bold">40-pin GPIO header</text>
<text x="640" y="751" font-size="13" fill="#e6edf3" >Top view / pins facing you</text>
<text x="70" y="420" font-size="14" fill="#e6edf3" >JST-SH end -&gt; either sensor port</text>
<text x="70" y="450" font-size="14" fill="#e6edf3" >Breakout adapter -&gt; jumpers -&gt; Pi</text>
<text x="70" y="495" font-size="13" fill="#e6edf3" >Signal order shown here is logical,</text>
<text x="70" y="519" font-size="13" fill="#e6edf3" >not connector contact order.</text>
<text x="70" y="555" font-size="13" fill="#e6edf3" >Verify your cable's signal mapping.</text>
<text x="70" y="579" font-size="13" fill="#e6edf3" >500 mm cable: green SDA, white SCL.</text>
<rect x="40" y="780" width="880" height="45" fill="#131c26"/>
<text x="60" y="808" font-size="15" fill="#f3c969" font-weight="bold">Power off before wiring. Use 3.3 V; never use 5 V pins 2 or 4.</text>
</g></svg>
