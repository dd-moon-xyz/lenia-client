<svg xmlns="http://www.w3.org/2000/svg" width="960" height="850" viewBox="0 0 960 850" role="img" aria-labelledby="title desc">
<title id="title">Multi-Sensor Stick to Raspberry Pi GPIO wiring</title><desc id="desc">3.3 volts to physical pin 1, SDA to pin 3, SCL to pin 5, ground to pin 6. Header has odd pins left, even pins right, pin 1 at top left.</desc>
<rect width="960" height="850" fill="#090d12"/>
<g font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace">
<text x="40" y="48" font-size="22" fill="#e6edf3" font-weight="bold">[ MULTI-SENSOR / RASPBERRY PI ]</text>
<text x="40" y="80" font-size="14" fill="#e6edf3" >Four wires / 3.3 V / I2C / physical header pin numbers</text>
<rect x="50" y="115" width="280" height="260" fill="#090d12" stroke="#344150" stroke-width="2"/>
<text x="75" y="145" font-size="16" fill="#e6edf3" font-weight="bold">Sensor cable signals</text>
<rect x="625" y="150" width="230" height="540" fill="#090d12" stroke="#344150" stroke-width="2"/>
