<svg xmlns="http://www.w3.org/2000/svg" width="960" height="850" viewBox="0 0 960 850" role="img" aria-labelledby="title desc">
<title id="title">Indicator LED to Raspberry Pi GPIO wiring</title>
<desc id="desc">Full 40-pin GPIO header, odd pins left, even pins right, pin 1 top left. Physical pin 12, GPIO18, connects through a 470 ohm resistor to the LED long leg, anode. The short leg, cathode, connects to physical pin 9, ground at 0 volts. GPIO18 outputs 3.3 volts when HIGH and 0 volts when LOW; the LED forward voltage depends on its model.</desc>
<rect width="960" height="850" fill="#090d12"/>
<g font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace">
<text x="40" y="48" font-size="22" fill="#e6edf3" font-weight="bold">[ INDICATOR LED / RASPBERRY PI ]</text>
<text x="40" y="80" font-size="14" fill="#e6edf3">GPIO18 / hardware PWM wiring / physical header pin numbers</text>
<rect x="50" y="115" width="350" height="260" fill="#090d12" stroke="#344150" stroke-width="2"/>
<text x="75" y="145" font-size="16" fill="#e6edf3" font-weight="bold">Small indicator LED</text>
<path d="M155 260V190Q155 160 185 160Q215 160 215 190V260Z" fill="#321923" stroke="#ff5370" stroke-width="3"/>
<path d="M215 260V279H690" fill="none" stroke="#93a4b5" stroke-width="5" stroke-linejoin="miter"/>
<path d="M155 260V305H425" fill="none" stroke="#ff5370" stroke-width="5" stroke-linejoin="miter"/>
<rect x="425" y="291" width="80" height="28" fill="#131c26" stroke="#f3c969" stroke-width="2"/>
<text x="465" y="345" text-anchor="middle" font-size="14" fill="#f3c969" font-weight="bold">470 ohm</text>
<text x="75" y="350" font-size="13" fill="#ff5370">+ long leg</text>
<text x="240" y="245" font-size="13" fill="#93a4b5">- short leg</text>
<rect x="625" y="150" width="230" height="540" fill="#090d12" stroke="#344150" stroke-width="2"/>
<path d="M400 279H690" stroke="#93a4b5" stroke-width="5"/>
<path d="M505 305H580V318H740V305H790" stroke="#ff5370" stroke-width="5"/>
<circle cx="690" cy="175" r="9" fill="#18212b" stroke="#526171"/><text x="667" y="180" font-size="12" fill="#e6edf3" text-anchor="end">1</text><circle cx="790" cy="175" r="9" fill="#18212b" stroke="#526171"/><text x="813" y="180" font-size="12" fill="#e6edf3" text-anchor="start">2</text><circle cx="690" cy="201" r="9" fill="#18212b" stroke="#526171"/><text x="667" y="206" font-size="12" fill="#e6edf3" text-anchor="end">3</text><circle cx="790" cy="201" r="9" fill="#18212b" stroke="#526171"/><text x="813" y="206" font-size="12" fill="#e6edf3" text-anchor="start">4</text><circle cx="690" cy="227" r="9" fill="#18212b" stroke="#526171"/><text x="667" y="232" font-size="12" fill="#e6edf3" text-anchor="end">5</text><circle cx="790" cy="227" r="9" fill="#18212b" stroke="#526171"/><text x="813" y="232" font-size="12" fill="#e6edf3" text-anchor="start">6</text><circle cx="690" cy="253" r="9" fill="#18212b" stroke="#526171"/><text x="667" y="258" font-size="12" fill="#e6edf3" text-anchor="end">7</text><circle cx="790" cy="253" r="9" fill="#18212b" stroke="#526171"/><text x="813" y="258" font-size="12" fill="#e6edf3" text-anchor="start">8</text><circle cx="690" cy="279" r="9" fill="#93a4b5" stroke="#93a4b5"/><text x="667" y="284" font-size="12" fill="#e6edf3" text-anchor="end">9</text><circle cx="790" cy="279" r="9" fill="#18212b" stroke="#526171"/><text x="813" y="284" font-size="12" fill="#e6edf3" text-anchor="start">10</text><circle cx="690" cy="305" r="9" fill="#18212b" stroke="#526171"/><text x="667" y="310" font-size="12" fill="#e6edf3" text-anchor="end">11</text><circle cx="790" cy="305" r="9" fill="#ff5370" stroke="#ff5370"/><text x="813" y="310" font-size="12" fill="#e6edf3" text-anchor="start">12</text><circle cx="690" cy="331" r="9" fill="#18212b" stroke="#526171"/><text x="667" y="336" font-size="12" fill="#e6edf3" text-anchor="end">13</text><circle cx="790" cy="331" r="9" fill="#18212b" stroke="#526171"/><text x="813" y="336" font-size="12" fill="#e6edf3" text-anchor="start">14</text><circle cx="690" cy="357" r="9" fill="#18212b" stroke="#526171"/><text x="667" y="362" font-size="12" fill="#e6edf3" text-anchor="end">15</text><circle cx="790" cy="357" r="9" fill="#18212b" stroke="#526171"/><text x="813" y="362" font-size="12" fill="#e6edf3" text-anchor="start">16</text><circle cx="690" cy="383" r="9" fill="#18212b" stroke="#526171"/><text x="667" y="388" font-size="12" fill="#e6edf3" text-anchor="end">17</text><circle cx="790" cy="383" r="9" fill="#18212b" stroke="#526171"/><text x="813" y="388" font-size="12" fill="#e6edf3" text-anchor="start">18</text><circle cx="690" cy="409" r="9" fill="#18212b" stroke="#526171"/><text x="667" y="414" font-size="12" fill="#e6edf3" text-anchor="end">19</text><circle cx="790" cy="409" r="9" fill="#18212b" stroke="#526171"/><text x="813" y="414" font-size="12" fill="#e6edf3" text-anchor="start">20</text><circle cx="690" cy="435" r="9" fill="#18212b" stroke="#526171"/><text x="667" y="440" font-size="12" fill="#e6edf3" text-anchor="end">21</text><circle cx="790" cy="435" r="9" fill="#18212b" stroke="#526171"/><text x="813" y="440" font-size="12" fill="#e6edf3" text-anchor="start">22</text><circle cx="690" cy="461" r="9" fill="#18212b" stroke="#526171"/><text x="667" y="466" font-size="12" fill="#e6edf3" text-anchor="end">23</text><circle cx="790" cy="461" r="9" fill="#18212b" stroke="#526171"/><text x="813" y="466" font-size="12" fill="#e6edf3" text-anchor="start">24</text><circle cx="690" cy="487" r="9" fill="#18212b" stroke="#526171"/><text x="667" y="492" font-size="12" fill="#e6edf3" text-anchor="end">25</text><circle cx="790" cy="487" r="9" fill="#18212b" stroke="#526171"/><text x="813" y="492" font-size="12" fill="#e6edf3" text-anchor="start">26</text><circle cx="690" cy="513" r="9" fill="#18212b" stroke="#526171"/><text x="667" y="518" font-size="12" fill="#e6edf3" text-anchor="end">27</text><circle cx="790" cy="513" r="9" fill="#18212b" stroke="#526171"/><text x="813" y="518" font-size="12" fill="#e6edf3" text-anchor="start">28</text><circle cx="690" cy="539" r="9" fill="#18212b" stroke="#526171"/><text x="667" y="544" font-size="12" fill="#e6edf3" text-anchor="end">29</text><circle cx="790" cy="539" r="9" fill="#18212b" stroke="#526171"/><text x="813" y="544" font-size="12" fill="#e6edf3" text-anchor="start">30</text><circle cx="690" cy="565" r="9" fill="#18212b" stroke="#526171"/><text x="667" y="570" font-size="12" fill="#e6edf3" text-anchor="end">31</text><circle cx="790" cy="565" r="9" fill="#18212b" stroke="#526171"/><text x="813" y="570" font-size="12" fill="#e6edf3" text-anchor="start">32</text><circle cx="690" cy="591" r="9" fill="#18212b" stroke="#526171"/><text x="667" y="596" font-size="12" fill="#e6edf3" text-anchor="end">33</text><circle cx="790" cy="591" r="9" fill="#18212b" stroke="#526171"/><text x="813" y="596" font-size="12" fill="#e6edf3" text-anchor="start">34</text><circle cx="690" cy="617" r="9" fill="#18212b" stroke="#526171"/><text x="667" y="622" font-size="12" fill="#e6edf3" text-anchor="end">35</text><circle cx="790" cy="617" r="9" fill="#18212b" stroke="#526171"/><text x="813" y="622" font-size="12" fill="#e6edf3" text-anchor="start">36</text><circle cx="690" cy="643" r="9" fill="#18212b" stroke="#526171"/><text x="667" y="648" font-size="12" fill="#e6edf3" text-anchor="end">37</text><circle cx="790" cy="643" r="9" fill="#18212b" stroke="#526171"/><text x="813" y="648" font-size="12" fill="#e6edf3" text-anchor="start">38</text><circle cx="690" cy="669" r="9" fill="#18212b" stroke="#526171"/><text x="667" y="674" font-size="12" fill="#e6edf3" text-anchor="end">39</text><circle cx="790" cy="669" r="9" fill="#18212b" stroke="#526171"/><text x="813" y="674" font-size="12" fill="#e6edf3" text-anchor="start">40</text>
<text x="660" y="118" font-size="14" fill="#ff5370" font-weight="bold">PIN 1 /</text>
<text x="640" y="725" font-size="16" fill="#e6edf3" font-weight="bold">40-pin GPIO header</text>
<text x="640" y="751" font-size="13" fill="#e6edf3" >Top view / pins facing you</text>

<text x="70" y="425" font-size="16" fill="#ff5370" font-weight="bold">Pin 12 / GPIO18: 3.3 V HIGH / 0 V LOW</text>
<text x="70" y="463" font-size="16" fill="#93a4b5" font-weight="bold">Pin 9 / GND: 0 V -&gt; LED -</text>
<text x="70" y="515" font-size="14" fill="#e6edf3">LED -: short leg / flat side of body.</text>
<text x="70" y="550" font-size="14" fill="#e6edf3">GPIO18 -&gt; 470 ohm -&gt; LED +</text>
<text x="70" y="585" font-size="14" fill="#e6edf3">Sensor pins 1, 3, 5, 6 stay unchanged.</text>
<text x="70" y="620" font-size="14" fill="#e6edf3">LED forward voltage depends on its model.</text>
<text x="70" y="655" font-size="14" fill="#e6edf3">Choose an LED with forward voltage below 3.3 V.</text>
<text x="70" y="687" font-size="14" fill="#e6edf3">Resistor drops the remaining voltage.</text>
<rect x="40" y="780" width="880" height="45" fill="#131c26"/>
<text x="60" y="808" font-size="15" fill="#f3c969" font-weight="bold">Power off before wiring. Always include the 470 ohm series resistor.</text>
</g></svg>
