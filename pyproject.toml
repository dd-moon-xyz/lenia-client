[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lenia-client"
version = "0.1.0"
description = "Fullscreen Lenia streaming client for an HDMI display"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pygame-ce==2.5.8",
    "websockets==17.2",
    "tqdm>=4.67,<5",
]

[project.scripts]
lenia-client = "lenia_client.client:main"
lenia-replay = "lenia_client.replay:main"
lenia-collect = "lenia_client.collect:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.uv]
python-preference = "only-managed"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lenia_client*"]
